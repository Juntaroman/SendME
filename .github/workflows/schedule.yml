name: Check Upwork Events

on:
  schedule:
    # 毎日午前9時(JST)に実行する設定 (UTC時刻で記述するため 0:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHubの画面から手動で実行テストをするための設定

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: コードのチェックアウト
      uses: actions/checkout@v4

    - name: Python環境のセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 必要なライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Pythonスクリプトの実行
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      run: python main.py

    - name: 実行履歴(notified_urls.txt)の更新と保存
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add notified_urls.txt
        git commit -m "Update notified_urls.txt" || exit 0
        git push
